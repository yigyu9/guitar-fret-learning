<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">G0에서 G2까지 단계별 검증 지도</title>
  <desc id="desc">G0의 고정 기타 skill 결합, G1의 자유 기타와 스트랩 안정화, G2의 인공 도움 축소와 전곡 확장을 현재 상태와 함께 비교</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK KR", NanumGothic, sans-serif; fill: #172338; }
      .title { font-size: 32px; font-weight: 700; }
      .sub { font-size: 16px; fill: #53647a; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: .05em; }
      .head { font-size: 24px; font-weight: 700; }
      .body { font-size: 16px; fill: #3f5067; }
      .small { font-size: 14px; fill: #53647a; }
      .status { font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f7f9fc"/>
  <text x="64" y="72" class="title">G0 → G1 → G2 | 난이도와 검증 범위가 단계적으로 커집니다</text>
  <text x="64" y="104" class="sub">각 단계는 이전 skill을 버리는 것이 아니라, 물리 조건과 책임을 추가하며 검증합니다.</text>

  <rect x="64" y="154" width="438" height="600" rx="20" fill="#ffffff" stroke="#91acd8" stroke-width="2"/>
  <rect x="64" y="154" width="438" height="76" rx="20" fill="#eaf1ff"/>
  <text x="92" y="188" class="label">기준 skill 결합</text>
  <text x="92" y="216" class="head">G0 · 고정 기타</text>
  <text x="92" y="276" class="body">물리 조건</text>
  <text x="112" y="306" class="small">• 기타 고정 · Fret/Strike source skill</text>
  <text x="112" y="332" class="small">• Canonical event + 공통 score clock</text>
  <text x="112" y="358" class="small">• Synchronizer + 105-slot action ABI (97 movable)</text>
  <text x="92" y="414" class="body">검증 질문</text>
  <text x="112" y="444" class="small">양손 readiness와 실제 crossing이</text>
  <text x="112" y="468" class="small">같은 event/time에서 맞물리는가?</text>
  <rect x="92" y="520" width="382" height="92" rx="14" fill="#f0f3f8"/>
  <text x="112" y="552" class="status">구현됨</text>
  <text x="112" y="578" class="small">compiler · Synchronizer · CPU action bridge</text>
  <rect x="92" y="630" width="382" height="88" rx="14" fill="#fff5d9"/>
  <text x="112" y="662" class="status">남은 검증</text>
  <text x="112" y="688" class="small">one-simulator physical G0 rollout</text>

  <path d="M502 454 H536" stroke="#53647a" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53647a"/></marker></defs>

  <rect x="532" y="154" width="438" height="600" rx="20" fill="#ffffff" stroke="#b6a4e2" stroke-width="2"/>
  <rect x="532" y="154" width="438" height="76" rx="20" fill="#f0ebff"/>
  <text x="560" y="188" class="label">안정화 추가</text>
  <text x="560" y="216" class="head">G1 · 자유 기타</text>
  <text x="560" y="276" class="body">물리 조건</text>
  <text x="580" y="306" class="small">• gravity + free guitar + routed strap</text>
  <text x="580" y="332" class="small">• Stability residual 43D / obs 264D</text>
  <text x="580" y="358" class="small">• source 연주와 안정성 함께 평가</text>
  <text x="560" y="414" class="body">검증 질문</text>
  <text x="580" y="444" class="small">기타가 떨어지지 않고 자세를 유지하며</text>
  <text x="580" y="468" class="small">Fret·Strike 성능을 보존하는가?</text>
  <rect x="560" y="520" width="382" height="92" rx="14" fill="#f0f3f8"/>
  <text x="580" y="552" class="status">기반 있음</text>
  <text x="580" y="578" class="small">strap / support / recovery 진단 실험</text>
  <rect x="560" y="630" width="382" height="88" rx="14" fill="#fff5d9"/>
  <text x="580" y="662" class="status">남은 검증</text>
  <text x="580" y="688" class="small">source-preserving 안정화 rollout</text>

  <path d="M970 454 H1004" stroke="#53647a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1000" y="154" width="438" height="600" rx="20" fill="#ffffff" stroke="#8bbeb0" stroke-width="2"/>
  <rect x="1000" y="154" width="438" height="76" rx="20" fill="#e5f4f0"/>
  <text x="1028" y="188" class="label">도움 축소와 확장</text>
  <text x="1028" y="216" class="head">G2 · 자연스러운 연주</text>
  <text x="1028" y="276" class="body">물리 조건</text>
  <text x="1048" y="306" class="small">• free guitar + strap 유지</text>
  <text x="1048" y="332" class="small">• 인공 assist 단계적으로 감소</text>
  <text x="1048" y="358" class="small">• 짧은 phrase에서 full song으로 확대</text>
  <text x="1028" y="414" class="body">검증 질문</text>
  <text x="1048" y="444" class="small">외부 도움 없이 시간·음악·안정성을</text>
  <text x="1048" y="468" class="small">긴 연주 구간에서도 만족하는가?</text>
  <rect x="1028" y="520" width="382" height="92" rx="14" fill="#f0f3f8"/>
  <text x="1048" y="552" class="status">목표 단계</text>
  <text x="1048" y="578" class="small">짧은 phrase → 안정적 full-song 평가</text>
  <rect x="1028" y="630" width="382" height="88" rx="14" fill="#fff5d9"/>
  <text x="1048" y="662" class="status">현재 상태</text>
  <text x="1048" y="688" class="small">아직 완료되지 않음</text>

  <text x="64" y="812" class="small">상태 읽기: “코드/인터페이스 구현”과 “하나의 물리 시뮬레이터에서 성공 검증”은 서로 다른 완료 기준입니다.</text>
</svg>
