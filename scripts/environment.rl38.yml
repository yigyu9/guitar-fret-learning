# Linux x86_64. Observed package versions on the source PC (2026-10-29).
# Isaac Gym Preview4 is bundled in the project; tab2body.py stages it locally.
name: tab2body-rl38
channels:
  - defaults
dependencies:
  - python=3.8.20
  - pip=24.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      - torchvision==0.19.1+cu121
      - numpy==1.23.5
      - scipy==1.10.1
      - gym==0.23.1
      - PyYAML==6.0.3
      - Pillow==10.4.0
      - imageio==2.35.1
      - matplotlib==3.7.5
      - psutil==5.9.8
      - ninja==1.13.0
